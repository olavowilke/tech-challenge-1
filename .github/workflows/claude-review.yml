name: Claude PR Review

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    # On PR open: always run. On comment: only if it's a PR comment containing @claude (from a human)
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@claude') &&
       github.event.comment.user.type != 'Bot')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          direct_prompt: "Review this PR for breaking issues: look for runtime exceptions, breaking API changes, missing null checks, transaction issues, and anything that could cause production failures."
        env:
          CLAUDE_DISABLE_SLASH_COMMANDS: true
