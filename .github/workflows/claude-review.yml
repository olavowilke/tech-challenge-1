name: Claude PR Review

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, edited]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    if: |
      (
        github.event_name == 'pull_request' &&
        contains(github.event.pull_request.body, '- [x] Run Claude review')
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@claude') &&
        github.event.comment.user.type != 'Bot'
      )
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR for breaking issues: look for runtime exceptions, breaking API changes, missing null checks, transaction issues, and anything that could cause production failures.
