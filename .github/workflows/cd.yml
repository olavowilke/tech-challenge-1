name: CD - Build image & Deploy

# Constrói e publica a imagem Docker no GHCR e, quando há credenciais de cluster,
# faz o deploy dos manifestos Kubernetes (app + banco) via kustomize.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/oficina-api

jobs:
  build-image:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: oficina-api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O deploy só roda quando o secret KUBECONFIG está configurado.
      # Sem ele, o job apenas documenta como habilitar (não falha o pipeline).
      - name: Check for cluster credentials
        id: creds
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          if [ -n "$KUBECONFIG_B64" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secret KUBECONFIG_B64 ausente — deploy pulado. Configure em Settings > Secrets para habilitar o CD no cluster."
          fi

      - name: Set up kubectl
        if: steps.creds.outputs.present == 'true'
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        if: steps.creds.outputs.present == 'true'
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Set image and apply manifests (app + banco)
        if: steps.creds.outputs.present == 'true'
        working-directory: k8s
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA}"
          curl -sLo kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz
          ./kustomize edit set image oficina-api="${IMAGE}"
          ./kustomize build . | kubectl apply -f -
          kubectl -n oficina rollout status deploy/oficina-api --timeout=180s
