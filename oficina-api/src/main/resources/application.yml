spring:
  application:
    name: oficina-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oficina_db}
    username: ${DB_USERNAME:oficina}
    password: ${DB_PASSWORD:oficina}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${JWT_SECRET:ZmljYXAtb2ZpY2luYS1hcGktc2VjcmV0LWtleS1tdXN0LWJlLWF0LWxlYXN0LTI1Ni1iaXRzLWxvbmch}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
  webhook:
    orcamento:
      # Token compartilhado que autentica notificações externas de decisão de orçamento.
      token: ${WEBHOOK_ORCAMENTO_TOKEN:dev-webhook-token-change-me}
  notificacao:
    email:
      # Em dev/test o envio real fica desabilitado (usa LogNotificacaoGateway).
      # Em produção defina true e configure spring.mail.* (SMTP/SendGrid).
      enabled: ${NOTIFICACAO_EMAIL_ENABLED:false}
      remetente: ${NOTIFICACAO_EMAIL_REMETENTE:nao-responder@oficina.com}

logging:
  level:
    br.com.oficina: INFO
    org.hibernate.SQL: WARN
